name: BidTech CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "frontend/**"
      - "dashboard-bidtech/**"
      - "compose.yml"
      - "compose.prod.yml"
      - ".github/workflows/deploy-bidtech.yml"
  pull_request:
    branches:
      - main
    paths: 
      - "templates/**"
      - "frontend/**"
      - "dashboard-bidtech/**"
      - "compose.yml"
      - "compose.prod.yml"
      - ".github/workflows/deploy-bidtech.yml"
  workflow_dispatch:

concurrency:
  group: vps-shared-repository
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
      IDCLOUDHOST_API_KEY: ${{ secrets.IDCLOUDHOST_API_KEY }}
      XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
      XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: "bidtech"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build template demos into frontend/public/demo
        working-directory: frontend
        run: npm run demos:build

      - name: Render frontend .env
        run: cp frontend/.env.example frontend/.env

      - name: Render dashboard .env
        run: |
          cp dashboard-bidtech/.env.example dashboard-bidtech/.env
          python3 <<'PY'
          import os
          from pathlib import Path

          overrides = {
              "FRONTEND_URL": "https://bidtech.co.id",
              "WHATSAPP_API_KEY": os.environ.get("WHATSAPP_API_KEY", ""),
              "FONNTE_TOKEN": os.environ.get("WHATSAPP_API_KEY", ""),
              "IDCLOUDHOST_API_KEY": os.environ.get("IDCLOUDHOST_API_KEY", ""),
              "XENDIT_WEBHOOK_TOKEN": os.environ.get("XENDIT_WEBHOOK_TOKEN", ""),
              "XENDIT_SECRET_KEY": os.environ.get("XENDIT_SECRET_KEY", ""),
              "MAIL_PASSWORD": os.environ.get("MAIL_PASSWORD", ""),
              "DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
              "APP_KEY": os.environ.get("APP_KEY", ""),
              "DB_HOST": "mysql",
          }

          def dotenv_value(value):
              # Docker Compose-compatible double-quoted value.
              return '"' + (
                  value.replace("\\", "\\\\")
                      .replace('"', '\\"')
                      .replace("$", "$$")
                      .replace("\r", "\\r")
                      .replace("\n", "\\n")
              ) + '"'

          path = Path("dashboard-bidtech/.env")
          lines = path.read_text().splitlines()
          found = set()
          output = []

          for line in lines:
              key = line.split("=", 1)[0] if "=" in line else None
              if key in overrides:
                  output.append(f"{key}={dotenv_value(overrides[key])}")
                  found.add(key)
              else:
                  output.append(line)

          for key, value in overrides.items():
              if key not in found:
                  output.append(f"{key}={dotenv_value(value)}")

          path.write_text("\n".join(output) + "\n")
          PY

      - name: Build images
        run: docker compose build

      - name: Report frontend image size
        run: |
          docker image ls bidtech-frontend:latest --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
          docker image inspect bidtech-frontend:latest --format 'Frontend image size (bytes): {{.Size}}'

      - name: Start MySQL
        run: docker compose up -d --wait mysql

      - name: Run migrations
        run: docker compose run --rm app php artisan migrate --force --seed

      - name: Start app & frontend
        run: docker compose up -d --wait app frontend

      - name: Health check dashboard
        run: curl -sf http://127.0.0.1:8000/up > /dev/null

      - name: Health check frontend
        run: curl -sf http://127.0.0.1:3010 > /dev/null

      - name: Smoke test all template demos
        run: node scripts/test-demos.js --server=http://127.0.0.1:3010

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Log in to GHCR
        if: success()
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Tag & push images
        if: success()
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for IMAGE in frontend dashboard; do
            docker tag "bidtech-$IMAGE:latest" "$REGISTRY/$OWNER/bidtech-$IMAGE:${{ github.sha }}"
            docker tag "bidtech-$IMAGE:latest" "$REGISTRY/$OWNER/bidtech-$IMAGE:latest"
            docker push "$REGISTRY/$OWNER/bidtech-$IMAGE:${{ github.sha }}"
            docker push "$REGISTRY/$OWNER/bidtech-$IMAGE:latest"
          done

      - name: Cleanup
        if: always()
        run: docker compose down -v

      - name: Upload deploy config for VPS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config
          include-hidden-files: true
          path: |
            compose.yml
            compose.prod.yml
            dashboard-bidtech/.env.example
            frontend/.env.example
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: bidtech
      url: https://bidtech.co.id
    permissions:
      actions: read
      packages: read

    steps:
      - name: Download deploy config
        uses: actions/download-artifact@v4
        with:
          name: deploy-config

      - name: Ensure /opt/bidtech exists on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /opt/bidtech/frontend /opt/bidtech/dashboard-bidtech

      - name: Copy compose & env templates to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yml,compose.prod.yml,dashboard-bidtech/.env.example,frontend/.env.example"
          target: "/opt/bidtech"
          strip_components: 0
          overwrite: true

      - name: Execute Remote SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          IDCLOUDHOST_API_KEY: ${{ secrets.IDCLOUDHOST_API_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          timeout: 2m
          command_timeout: 60m

          envs: GHCR_TOKEN,WHATSAPP_API_KEY,IDCLOUDHOST_API_KEY,XENDIT_WEBHOOK_TOKEN,XENDIT_SECRET_KEY,MAIL_PASSWORD,DB_PASSWORD,APP_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY

          script: |
            set -e
            cd /opt/bidtech

            echo "1.) Render .env frontend & dashboard"
            cp frontend/.env.example frontend/.env

            cp dashboard-bidtech/.env.example dashboard-bidtech/.env
            python3 <<'PY'
            import os
            from pathlib import Path

            overrides = {
                "FRONTEND_URL": "https://bidtech.co.id",
                "WHATSAPP_API_KEY": os.environ.get("WHATSAPP_API_KEY", ""),
                "FONNTE_TOKEN": os.environ.get("WHATSAPP_API_KEY", ""),
                "IDCLOUDHOST_API_KEY": os.environ.get("IDCLOUDHOST_API_KEY", ""),
                "XENDIT_WEBHOOK_TOKEN": os.environ.get("XENDIT_WEBHOOK_TOKEN", ""),
                "XENDIT_SECRET_KEY": os.environ.get("XENDIT_SECRET_KEY", ""),
                "MAIL_PASSWORD": os.environ.get("MAIL_PASSWORD", ""),
                "DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
                "APP_KEY": os.environ.get("APP_KEY", ""),
                "DB_HOST": "mysql",
                "AWS_ACCESS_KEY_ID": os.environ.get("AWS_ACCESS_KEY_ID", ""),
                "AWS_SECRET_ACCESS_KEY": os.environ.get("AWS_SECRET_ACCESS_KEY", ""),
                "AWS_DEFAULT_REGION": "us-east-1",
                "AWS_BUCKET": "bidtech",
                "AWS_URL": "https://media.bidtech.co.id/bidtech",
                "AWS_ENDPOINT": "https://media.bidtech.co.id",
                "AWS_USE_PATH_STYLE_ENDPOINT": "true",
            }

            overrides.update({
                "APP_ENV": "production",
                "APP_DEBUG": "false",
                "APP_URL": "https://dashboard.bidtech.co.id",
            })

            def dotenv_value(value):
                # Docker Compose-compatible double-quoted value.
                return '"' + (
                    value.replace("\\", "\\\\")
                        .replace('"', '\\"')
                        .replace("$", "$$")
                        .replace("\r", "\\r")
                        .replace("\n", "\\n")
                ) + '"'

            path = Path("dashboard-bidtech/.env")
            lines = path.read_text().splitlines()
            found = set()
            output = []

            for line in lines:
                key = line.split("=", 1)[0] if "=" in line else None
                if key in overrides:
                    output.append(f"{key}={dotenv_value(overrides[key])}")
                    found.add(key)
                else:
                    output.append(line)

            for key, value in overrides.items():
                if key not in found:
                    output.append(f"{key}={dotenv_value(value)}")

            path.write_text("\n".join(output) + "\n")
            PY

            echo "2.) Login ke GHCR & tarik image"
            export REGISTRY="ghcr.io"
            export GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG="${{ github.sha }}"
            
            export DB_DATABASE="bidtech"
            
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
            docker compose -f compose.yml -f compose.prod.yml pull

            echo "3.) Up stack & migrate"
            docker compose -f compose.yml -f compose.prod.yml up -d --wait mysql
            docker compose -f compose.yml -f compose.prod.yml run --rm app php artisan migrate --force --seed
            docker compose -f compose.yml -f compose.prod.yml up -d --wait app frontend

            echo "==> Status"
            docker compose -f compose.yml -f compose.prod.yml ps

            echo "==> Logs"
            docker compose -f compose.yml -f compose.prod.yml logs --tail 100 app
            docker compose -f compose.yml -f compose.prod.yml logs --tail 100 frontend
