name: Nadim Trans CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "projects/nadim-trans-rentcar/**"
      - ".github/workflows/deploy-nadimtrans.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/nadim-trans-rentcar/**"
      - ".github/workflows/deploy-nadimtrans.yml"
  workflow_dispatch:

concurrency:
  group: deploy-nadimtrans
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    defaults:
      run:
        working-directory: projects/nadim-trans-rentcar
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/nadim-trans-rentcar/package-lock.json

      - name: Build image
        run: docker compose build

      - name: Start application
        run: docker compose up -d --wait

      - name: Health check
        run: curl -sf http://127.0.0.1:3040/ > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Log in to GHCR
        if: success()
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Tag & push image
        if: success()
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker tag "nadimtrans-web:latest" "$REGISTRY/$OWNER/nadimtrans:${{ github.sha }}"
          docker tag "nadimtrans-web:latest" "$REGISTRY/$OWNER/nadimtrans:latest"
          docker push "$REGISTRY/$OWNER/nadimtrans:${{ github.sha }}"
          docker push "$REGISTRY/$OWNER/nadimtrans:latest"

      - name: Cleanup
        if: always()
        run: docker compose down -v

      - name: Stage deploy config
        run: |
          mkdir -p /tmp/deploy-nadimtrans
          cp compose.yml compose.prod.yml /tmp/deploy-nadimtrans/

      - name: Upload deploy config for VPS
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config-nadimtrans
          include-hidden-files: true
          path: /tmp/deploy-nadimtrans/*
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: nadimtrans
      url: https://nadimtrans.com
    permissions:
      actions: read
      packages: read

    steps:
      - name: Download deploy config
        uses: actions/download-artifact@v4
        with:
          name: deploy-config-nadimtrans

      - name: Ensure /opt/nadimtrans exists on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /opt/nadimtrans

      - name: Copy compose config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yml,compose.prod.yml"
          target: "/opt/nadimtrans"
          strip_components: 0
          overwrite: true

      - name: Execute remote deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 60m
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/nadimtrans
            export REGISTRY="ghcr.io"
            export GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG="${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
            docker compose -f compose.yml -f compose.prod.yml pull
            docker compose -f compose.yml -f compose.prod.yml up -d --wait nadimtrans-web
            docker compose -f compose.yml -f compose.prod.yml ps
            docker compose -f compose.yml -f compose.prod.yml logs --tail 100 nadimtrans-web
