name: Semesta Pro CI/CD

on:
  push:
    branches: [main]
    paths:
      - "projects/semestapro-project/**"
      - "!projects/semestapro-project/docs/**"
      - "!projects/semestapro-project/**/*.md"
      - ".github/workflows/deploy-semestapro.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/semestapro-project/**"
      - "!projects/semestapro-project/docs/**"
      - "!projects/semestapro-project/**/*.md"
      - ".github/workflows/deploy-semestapro.yml"
  workflow_dispatch:

concurrency:
  group: deploy-semestapro
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: semestapro
  VPS_DIR: /opt/semestapro
  PROJECT_DIR: projects/semestapro-project

jobs:
  # ---------------------------------------------------------------- 1. Code testing
  test:
    name: Code testing (fmt, vet, lint, unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/semestapro-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/semestapro-project/go.mod
          cache-dependency-path: projects/semestapro-project/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: projects/semestapro-project

      - name: Unit tests (race)
        run: go test ./... -race -count=1

  # ----------------------------------------- 2. Build & test image, 3. Make artifact & push GHCR
  build:
    name: Build image, smoke test, push to GHCR
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    defaults:
      run:
        working-directory: projects/semestapro-project
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: projects/semestapro-project
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render throw-away CI .env
        env:
          RENDER_APP_ENV: production
          RENDER_APP_DEBUG: "false"
          RENDER_APP_HOST: 0.0.0.0   # must listen on all interfaces inside the container
          RENDER_APP_PORT: "3000"
          RENDER_APP_KEY: "0123456789abcdef0123456789abcdef"   # throw-away, CI only
          RENDER_APP_URL: http://127.0.0.1:3000
          RENDER_DB_DATABASE: storage/database/semestapro.db
          # The S3 driver rejects empty config at boot; the CI smoke test never touches storage.
          RENDER_MEDIA_KEY: ci-key
          RENDER_MEDIA_SECRET: ci-secret
          RENDER_MEDIA_ENDPOINT: http://127.0.0.1:9000
          RENDER_MEDIA_URL: http://127.0.0.1:9000/semestapro-media
        # Inline renderer: every RENDER_<KEY> env var becomes <KEY>=<value> in the template (empty values
        # are skipped, so the template default stays). Plain values are written bare, because
        # `docker run --env-file` keeps quotes literally; anything else is single-quoted for Docker
        # Compose and refused in "strict" mode.
        run: |
          python3 - .env.example ci.env strict <<'PY'
          import os, re, sys
          os.umask(0o077)
          tpl, out, strict = sys.argv[1], sys.argv[2], len(sys.argv) > 3
          ov = {k[7:]: v.strip() for k, v in os.environ.items() if k.startswith("RENDER_") and v.strip()}
          def fmt(k, v):
              if "\n" in v or "\r" in v or "'" in v:
                  sys.exit(f"render_env: {k} contains a newline or single quote")
              if re.fullmatch(r"[A-Za-z0-9_./:@,+=-]*", v):
                  return v
              if strict:
                  sys.exit(f"render_env: {k} needs quoting, which docker run --env-file does not support")
              return f"'{v}'"
          seen, lines = set(), []
          for line in open(tpl).read().splitlines():
              k = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if k in ov:
                  lines.append(f"{k}={fmt(k, ov[k])}")
                  seen.add(k)
              else:
                  lines.append(line)
          lines += [f"{k}={fmt(k, v)}" for k, v in ov.items() if k not in seen]
          open(out, "w").write("\n".join(lines) + "\n")
          print(f"render_env: wrote {out} ({len(ov)} keys overridden)")
          PY

      - name: Migrate & seed in a scratch volume
        run: |
          docker volume create sp-ci-data
          docker run --rm --env-file ci.env -v sp-ci-data:/app/storage "$IMAGE_NAME:ci" artisan migrate --force
          docker run --rm --env-file ci.env -v sp-ci-data:/app/storage "$IMAGE_NAME:ci" artisan db:seed

      - name: Start container
        run: docker run -d --name sp-ci --env-file ci.env -v sp-ci-data:/app/storage -p 127.0.0.1:3000:3000 "$IMAGE_NAME:ci"

      - name: Smoke test container
        run: bash scripts/smoke.sh http://127.0.0.1:3000 /healthz /
        # Add /robots.txt /sitemap.xml /llms.txt here once those endpoints exist.

      - name: Dump logs on failure
        if: failure()
        run: docker logs sp-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f sp-ci 2>/dev/null || true
          docker volume rm sp-ci-data 2>/dev/null || true
          rm -f ci.env

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          for tag in "${{ github.sha }}" latest; do
            docker tag "$IMAGE_NAME:ci" "${{ steps.meta.outputs.image }}:$tag"
            docker push "${{ steps.meta.outputs.image }}:$tag"
          done

      # Deploy artifact: everything the VPS needs besides the image itself, laid out flat.
      - name: Stage deploy files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p deploy-staging/scripts deploy-staging/deploy/nginx
          cp docker-compose.prod.yml .env.example deploy-staging/
          cp scripts/smoke.sh deploy-staging/scripts/
          cp deploy/litestream.yml deploy-staging/deploy/
          cp deploy/nginx/*.conf deploy-staging/deploy/nginx/

      - name: Upload deploy artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config
          include-hidden-files: true
          retention-days: 1
          path: projects/semestapro-project/deploy-staging/

  # ------------------------------------------- 4-7. Upload to VPS, env, pull+up, smoke test
  deploy:
    name: Deploy to VPS
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: semestapro
      url: ${{ vars.APP_URL || 'https://semestapro.co.id' }}    
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Validate required secrets and variables
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_KEY: ${{ secrets.SEMESTAPRO_APP_KEY }}
          MEDIA_KEY: ${{ secrets.SEMESTAPRO_MEDIA_KEY }}
          MEDIA_SECRET: ${{ secrets.SEMESTAPRO_MEDIA_SECRET }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_KEY MEDIA_KEY MEDIA_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (app-specific ones are named SEMESTAPRO_* in GitHub; SSH_* are shared)"; missing=1; fi
          done
          if [ -n "$APP_KEY" ] && [ "${#APP_KEY}" -ne 32 ]; then
            echo "::error::SEMESTAPRO_APP_KEY must be exactly 32 characters (Goravel, not Laravel: no base64: prefix). Generate: openssl rand -hex 16"; missing=1
          fi
          exit $missing

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-config

      - name: Ensure ${{ env.VPS_DIR }} exists on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.VPS_DIR }}/scripts ${{ env.VPS_DIR }}/deploy/nginx

      # Secrets are only ever written to this runner's disk and the VPS .env (mode 600); never printed.
      - name: Render production .env (values from secrets and variables)
        env:
          RENDER_APP_ENV: production
          RENDER_APP_DEBUG: "false"
          RENDER_APP_HOST: 0.0.0.0   # must listen on all interfaces inside the container
          RENDER_APP_PORT: "3000"
          RENDER_LOG_LEVEL: info
          RENDER_DB_DATABASE: storage/database/semestapro.db
          RENDER_SESSION_SECURE: "true"
          RENDER_APP_KEY: ${{ secrets.SEMESTAPRO_APP_KEY }}
          RENDER_APP_URL: ${{ vars.SEMESTAPRO_APP_URL || 'https://semestapro.co.id' }}
          RENDER_MEDIA_KEY: ${{ secrets.SEMESTAPRO_MEDIA_KEY }}
          RENDER_MEDIA_SECRET: ${{ secrets.SEMESTAPRO_MEDIA_SECRET }}
          RENDER_MEDIA_ENDPOINT: ${{ vars.SEMESTAPRO_MEDIA_ENDPOINT || 'https://cdn.semestapro.co.id' }}
          RENDER_MEDIA_BUCKET: ${{ vars.SEMESTAPRO_MEDIA_BUCKET || 'semestapro-media' }}
          RENDER_MEDIA_REGION: us-east-1
          RENDER_MEDIA_URL: ${{ vars.SEMESTAPRO_MEDIA_URL || 'https://cdn.semestapro.co.id/semestapro-media' }}
          RENDER_MEDIA_USE_PATH_STYLE: "true"
          # Read by docker-compose.prod.yml for variable substitution.
          RENDER_APP_IMAGE: ${{ needs.build.outputs.image }}
          RENDER_APP_TAG: ${{ github.sha }}
          # Optional business overrides (empty = keep the value from .env.example / config/site.go).
          RENDER_SITE_WHATSAPP: ${{ vars.SEMESTAPRO_SITE_WHATSAPP }}
          RENDER_SITE_PHONE_DISPLAY: ${{ vars.SEMESTAPRO_SITE_PHONE_DISPLAY }}
          RENDER_SITE_EMAIL: ${{ vars.SEMESTAPRO_SITE_EMAIL }}
          RENDER_SECURITY_CONTACT: ${{ vars.SEMESTAPRO_SECURITY_CONTACT }}
        # Inline renderer: every RENDER_<KEY> env var becomes <KEY>=<value> in the template (empty values
        # are skipped, so the template default stays). Plain values are written bare, because
        # `docker run --env-file` keeps quotes literally; anything else is single-quoted for Docker
        # Compose and refused in "strict" mode.
        run: |
          python3 - .env.example .env.new <<'PY'
          import os, re, sys
          os.umask(0o077)
          tpl, out, strict = sys.argv[1], sys.argv[2], len(sys.argv) > 3
          ov = {k[7:]: v.strip() for k, v in os.environ.items() if k.startswith("RENDER_") and v.strip()}
          def fmt(k, v):
              if "\n" in v or "\r" in v or "'" in v:
                  sys.exit(f"render_env: {k} contains a newline or single quote")
              if re.fullmatch(r"[A-Za-z0-9_./:@,+=-]*", v):
                  return v
              if strict:
                  sys.exit(f"render_env: {k} needs quoting, which docker run --env-file does not support")
              return f"'{v}'"
          seen, lines = set(), []
          for line in open(tpl).read().splitlines():
              k = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if k in ov:
                  lines.append(f"{k}={fmt(k, ov[k])}")
                  seen.add(k)
              else:
                  lines.append(line)
          lines += [f"{k}={fmt(k, v)}" for k, v in ov.items() if k not in seen]
          open(out, "w").write("\n".join(lines) + "\n")
          print(f"render_env: wrote {out} ({len(ov)} keys overridden)")
          PY
          # The scp action runs in a container under another user and cannot read a mode-600 file;
          # the file only lives on this throw-away runner and is chmod 600 again on the VPS.
          chmod 644 .env.new

      - name: Copy compose, env and scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,.env.new,scripts/smoke.sh,deploy/litestream.yml,deploy/nginx/*.conf"
          target: ${{ env.VPS_DIR }}
          overwrite: true

      - name: Pull image, migrate, start (on VPS)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,APP_TAG
          script: |
            set -euo pipefail
            cd /opt/semestapro
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "1.) Activate the new .env (rendered by the workflow, mode 600)"
            PREV_TAG=""
            if [ -f .env ]; then PREV_TAG="$(grep -E '^APP_TAG=' .env | head -1 | cut -d= -f2- | tr -d "'" || true)"; fi
            chmod 600 .env.new
            mv -f .env.new .env
            echo "previous tag: ${PREV_TAG:-none} -> new tag: $APP_TAG"

            echo "2.) Login to GHCR and pull the image"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $COMPOSE pull app

            echo "3.) Migrate and seed (idempotent) with the new image"
            $COMPOSE run --rm --no-deps app artisan migrate --force
            $COMPOSE run --rm --no-deps app artisan db:seed

            echo "4.) Start / update the container and wait for the healthcheck"
            if ! $COMPOSE up -d --wait --wait-timeout 120 app; then
              echo "::error::New container is unhealthy. Logs:"
              $COMPOSE logs --tail 100 app || true
              if [ -n "$PREV_TAG" ]; then
                echo "Rolling back container to $PREV_TAG (database migrations are forward-only)"
                sed -i "s/^APP_TAG=.*/APP_TAG=$PREV_TAG/" .env
                $COMPOSE up -d --wait --wait-timeout 120 app || true
              fi
              exit 1
            fi

            echo "5.) Cleanup old images"
            docker image prune -f --filter "until=168h" >/dev/null

            echo "==> Status"
            $COMPOSE ps
            $COMPOSE logs --tail 50 app

      - name: Smoke test on VPS (local port)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/semestapro/scripts/smoke.sh http://127.0.0.1:3050 /healthz /

      - name: Smoke test public URL
        env:
          SMOKE_URL: ${{ vars.SEMESTAPRO_APP_URL || 'https://semestapro.co.id' }}
        run: bash scripts/smoke.sh "$SMOKE_URL" /healthz /
        # Add /robots.txt /sitemap.xml /llms.txt once those endpoints exist.