name: bidtech

services:
  frontend:
    build:
      context: ./frontend
    image: bidtech-frontend:latest
    env_file:
      - ./frontend/.env
    ports:
      - "127.0.0.1:3010:3000"

  app:
    build:
      context: ./dashboard-bidtech
      secrets:
        - composer_auth
    image: bidtech-dashboard:latest
    env_file:
      - ./dashboard-bidtech/.env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dashboard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dashboard_mysql_data:

secrets:
  # Build secret untuk Composer (lihat dashboard-bidtech/Dockerfile).
  # Di CI diisi token GitHub; di lokal boleh dibiarkan kosong.
  composer_auth:
    environment: COMPOSER_AUTH
