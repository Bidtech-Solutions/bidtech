name: funtravel

services:
  web:
    image: ${IMAGE:-ghcr.io/bidtech/funtravel}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://fungetgo.com}
        NUXT_PUBLIC_GA_ID: ${NUXT_PUBLIC_GA_ID:-}
    container_name: funtravel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3050}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
