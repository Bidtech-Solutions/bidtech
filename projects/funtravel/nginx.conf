# ─────────────────────────────────────────────────────────────────────────────
# Nginx DALAM container (nginxinc/nginx-unprivileged, port 8080) → disalin sebagai conf.d/default.conf.
# Menyajikan .output/public hasil `nuxt generate` + redirect bahasa di "/" (docs/ARCHITECTURE.md §5).
# Di depan container ini ada Nginx host (TLS) dan Cloudflare.
# Tidak ada IPv6 (`listen [::]`) karena container Docker umumnya tanpa IPv6.
# ─────────────────────────────────────────────────────────────────────────────

# ── Pilih bahasa untuk "/" (urut): cookie ft_locale → browser Mandarin → negara Cloudflare → Accept-Language → en
map $cookie_ft_locale $ft_loc_cookie {
  ~^(en|ms|zh|id)$ $1;
  default          "";
}
map $http_accept_language $ft_loc_zh {
  ~*^zh   zh;
  default "";
}
map $http_cf_ipcountry $ft_loc_country {
  MY      ms;
  ID      id;
  CN      zh;
  TW      zh;
  HK      zh;
  default "";   # SG sengaja tidak dipetakan: ditentukan bahasa browser (zh/en)
}
map $http_accept_language $ft_loc_lang {
  ~*^zh        zh;
  ~*^ms        ms;
  ~*^(id|in)   id;
  ~*^en        en;
  default      "";
}
map $ft_loc_cookie $ft_loc_1 { ""  $ft_loc_zh;      default $ft_loc_cookie; }
map $ft_loc_1      $ft_loc_2 { ""  $ft_loc_country; default $ft_loc_1; }
map $ft_loc_2      $ft_loc_3 { ""  $ft_loc_lang;    default $ft_loc_2; }
map $ft_loc_3      $ft_locale { "" en;              default $ft_loc_3; }

# Negara (2 huruf) → default mata uang di klien: ID→IDR, MY→MYR, SG→SGD
map $http_cf_ipcountry $ft_country {
  "~^([A-Z]{2})$" $1;
  default         "";
}

# ── Cache-Control per jenis file (satu header di level server) ───────────────
map $uri $ft_cache {
  default                                   "public, max-age=0, s-maxage=86400, must-revalidate";   # HTML, _payload.json, /_i18n/*
  ~^/_nuxt/builds/                          "public, max-age=0, must-revalidate";                   # manifest build: berubah tiap deploy
  ~^/_nuxt/                                 "public, max-age=31536000, immutable";                  # aset ber-hash
  ~^/(sitemap|robots|llms|__sitemap__)      "public, max-age=3600";
  ~^/favicon\.ico$                          "public, max-age=604800";
  /404.html                                 "public, max-age=300";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;   # di belakang proxy: redirect relatif, tidak bocor ke :8080
  port_in_redirect off;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

  # Header keamanan + cache. HSTS diatur di Cloudflare. 'unsafe-inline' dibutuhkan skrip payload Nuxt (window.__NUXT__).
  # Tambah domain di sini bila memakai layanan pihak ketiga baru.
  add_header Cache-Control $ft_cache always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.frankfurter.dev https://open.er-api.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

  # Health check (Docker & workflow deploy)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # "/" → /{bahasa}. WAJIB bypass cache di Cloudflare (redirect berbeda per negara/cookie).
  location = / {
    add_header Cache-Control "no-store" always;
    add_header Vary "Cookie, Accept-Language" always;
    add_header Set-Cookie "ft_country=$ft_country; Path=/; Max-Age=2592000; SameSite=Lax" always;
    return 302 /$ft_locale$is_args$args;
  }

  # URL tanpa prefix bahasa (mis. dibagikan manual) → versi bahasa pengunjung
  location ~ ^/(packages|vehicles|contact)(/.*)?$ {
    add_header Cache-Control "no-store" always;
    return 302 /$ft_locale$uri$is_args$args;
  }

  location / {
    # satu URL kanonis per halaman: tanpa trailing slash (/en/packages/ → 301 /en/packages)
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
