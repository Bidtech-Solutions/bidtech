version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - misspell
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # User-facing validation messages are Indonesian sentences and may end with punctuation.
      - linters: [staticcheck]
        text: "ST1005"
formatters:
  enable:
    - gofmt
