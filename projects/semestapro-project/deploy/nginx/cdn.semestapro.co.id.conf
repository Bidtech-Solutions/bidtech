# S3 endpoint AND public photo host for Semesta Pro: https://cdn.semestapro.co.id
#
#  - The app uploads server-to-server with SigV4 (path-style): PUT https://cdn.semestapro.co.id/semestapro-media/<key>
#  - Browsers read photos from the same URL: GET https://cdn.semestapro.co.id/semestapro-media/listings/...
#    (anonymous read is granted by the bucket policy on listings/*; writes always need the access key)
#
# Only the semestapro-media bucket is exposed on this host. RustFS is shared with other projects,
# so every other path returns 404. SigV4 signs the Host header, so it is forwarded unchanged.

# Long cache for reads only (empty value = header omitted for PUT/DELETE/etc.).
map $request_method $sp_cdn_cache {
    default "";
    GET     "public, max-age=31536000, immutable";
    HEAD    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.semestapro.co.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://cdn.semestapro.co.id$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cdn.semestapro.co.id;

    ssl_certificate     /etc/letsencrypt/live/cdn.semestapro.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.semestapro.co.id/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;

    # Uploaded photos are already ≤ 300 KB (docs/PRD.md FR-IMG); the raw upload before processing
    # goes to the app, not here.
    client_max_body_size 10m;

    location ~ ^/semestapro-media(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;

        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control $sp_cdn_cache always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / { return 404; }
}
