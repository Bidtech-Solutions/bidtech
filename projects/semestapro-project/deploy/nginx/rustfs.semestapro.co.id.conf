# RustFS web console (monitoring): https://rustfs.semestapro.co.id  →  127.0.0.1:9001
#
# WARNING: this console manages the WHOLE shared RustFS instance (every project's buckets and
# keys), and its login is the RustFS admin account. Do not leave it open to the internet:
# protect it with Cloudflare Access / Zero Trust, or restrict by IP below, or both.

server {
    listen 80;
    listen [::]:80;
    server_name rustfs.semestapro.co.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rustfs.semestapro.co.id$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rustfs.semestapro.co.id;

    ssl_certificate     /etc/letsencrypt/live/rustfs.semestapro.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rustfs.semestapro.co.id/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Restrict to your own IPs (uncomment and edit). If Cloudflare proxies this host, real client
    # IPs require the realip module (set_real_ip_from <Cloudflare ranges>; real_ip_header CF-Connecting-IP).
    # allow 203.0.113.10;
    # deny all;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for the console.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
