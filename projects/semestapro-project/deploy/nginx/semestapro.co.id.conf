# Host Nginx → app container (127.0.0.1:3050). Place in /etc/nginx/sites-available and symlink
# to sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS: adjust ssl_certificate paths to your setup (certbot shown; with Cloudflare Origin
# Certificates point to those files and set SSL mode to "Full (strict)").

upstream semestapro_app {
    server 127.0.0.1:3050;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name semestapro.co.id www.semestapro.co.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://semestapro.co.id$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.semestapro.co.id;
    ssl_certificate     /etc/letsencrypt/live/semestapro.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semestapro.co.id/privkey.pem;
    return 301 https://semestapro.co.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name semestapro.co.id;

    ssl_certificate     /etc/letsencrypt/live/semestapro.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semestapro.co.id/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain text/markdown image/svg+xml;
    gzip_min_length 1024;

    # Photos are uploaded one by one (≤ ~15 MB each, docs/PRD.md FR-IMG-02).
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Public URLs have no trailing slash (docs/ARCHITECTURE.md §5).
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed assets (?v=…) are immutable.
    location /static/ {
        proxy_pass http://semestapro_app;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://semestapro_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # If Cloudflare fronts this server, use $http_cf_connecting_ip (and set_real_ip_from
        # Cloudflare ranges) instead of $remote_addr so login throttling sees the visitor IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
