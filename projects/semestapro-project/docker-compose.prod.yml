# Production on the VPS (/opt/semestapro). The image is built in CI and pulled here;
# nothing is built on the server.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --wait
#   docker compose -f docker-compose.prod.yml exec app ./semestapro artisan migrate --force
#
# .env is rendered by scripts/render_env.py in the deploy workflow. It carries APP_KEY, MEDIA_KEY, MEDIA_SECRET,
# MEDIA_ENDPOINT=https://cdn.semestapro.co.id, MEDIA_URL=https://cdn.semestapro.co.id/semestapro-media.
#
# `name:` and the explicit volume names are fixed on purpose: changing the Compose project
# name must never make the database volume look empty.
name: semestapro

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/OWNER/semestapro}:${APP_TAG:-latest}
    container_name: semestapro-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      APP_DEBUG: "false"
      DB_DATABASE: storage/database/semestapro.db
    # Only host Nginx talks to the app. 3050 is unused by the other projects on this VPS
    # (3000 SH-CRM, 3010 BidTech, 3020 HKTI, 3040 Nadimtrans) — re-check with `ss -tulpn`.
    ports:
      - "127.0.0.1:3050:3000"
    volumes:
      - semestapro_data:/app/storage
    # Photos go to RustFS through the public S3 endpoint https://cdn.semestapro.co.id
    # (Nginx → 127.0.0.1:9000, see deploy/nginx/cdn.semestapro.co.id.conf), so this container
    # needs no access to RustFS's Docker network.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512M # shared 4 GB VPS; image decoding is capped by IMAGE_MAX_CONCURRENCY

  # Opt-in SQLite replication:  docker compose -f docker-compose.prod.yml --profile backup up -d
  # Replicate to a bucket OFF this VPS (see deploy/litestream.yml); a replica on the same
  # disk is not a backup.
  litestream:
    image: litestream/litestream:0.3
    profiles: ["backup"]
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - semestapro_data:/app/storage
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  semestapro_data:
    name: semestapro_data
