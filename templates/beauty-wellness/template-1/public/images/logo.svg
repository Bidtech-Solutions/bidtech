<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06e33"/>
      <stop offset="100%" stop-color="#c45b25"/>
    </linearGradient>
    <linearGradient id="fullSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (scaled to fit ~90px height) -->
  <g transform="translate(10, 15) scale(0.35)">
    <path d="M0,45 L45,0 L45,215 L0,260 Z" fill="url(#fullSteel)"/>
    <path d="M60,0 L205,0 L170,45 L60,45 Z" fill="url(#fullRust)"/>
    <path d="M60,80 L165,80 L135,125 L60,125 Z" fill="url(#fullRust)"/>
    <polygon points="60,160 105,160 85,190 60,190" fill="#e06e33"/>
  </g>
  
  <!-- Wordmark -->
  <text x="110" y="70" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="#ffffff">IRONFORCE</text>
  <text x="112" y="98" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" letter-spacing="7" fill="#c45b25">BUILT FOR STRENGTH</text>
</svg>