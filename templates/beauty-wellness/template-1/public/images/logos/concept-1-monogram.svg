<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e27035"/>
      <stop offset="100%" stop-color="#c45b25"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" rx="36" fill="url(#bg1)"/>
  
  <!-- Subtle circular knurling ring -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="#252525" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="300" cy="270" r="205" fill="none" stroke="#c45b25" stroke-opacity="0.18" stroke-width="1"/>
  
  <!-- Monogram IF Icon -->
  <g transform="translate(195, 140)">
    <!-- Letter 'I' (Left pillar with 45deg cut) -->
    <path d="M0,45 L45,0 L45,215 L0,260 Z" fill="url(#steelGrad)"/>
    
    <!-- Letter 'F' (Top Bar) -->
    <path d="M60,0 L205,0 L170,45 L60,45 Z" fill="url(#rustGrad)"/>
    
    <!-- Letter 'F' (Middle Bar) -->
    <path d="M60,80 L165,80 L135,125 L60,125 Z" fill="url(#rustGrad)"/>
    
    <!-- Letter 'F' (Stem Accent Notch) -->
    <polygon points="60,160 105,160 85,190 60,190" fill="#e06e33" opacity="0.9"/>
  </g>
  
  <!-- Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#ffffff">IRONFORCE</text>
  <text x="300" y="515" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" letter-spacing="10" fill="#c45b25">BUILT FOR STRENGTH</text>
</svg>