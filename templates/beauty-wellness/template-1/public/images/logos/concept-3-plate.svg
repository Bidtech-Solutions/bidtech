<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="hexRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06e33"/>
      <stop offset="100%" stop-color="#c45b25"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" rx="36" fill="url(#bg3)"/>
  
  <g transform="translate(300, 240)">
    <!-- Outer Octagon / Plate -->
    <path d="M-130,-54 L-54,-130 L54,-130 L130,-54 L130,54 L54,130 L-54,130 L-130,54 Z" fill="#181818" stroke="#2e2e2e" stroke-width="4"/>
    
    <!-- Rust Grip Slots (Cutouts like an Eleiko/Rogue Grip Plate) -->
    <path d="M-100,-41 L-41,-100 L41,-100 L100,-41 L100,41 L41,100 L-41,100 L-100,41 Z" fill="none" stroke="#c45b25" stroke-width="6"/>
    
    <!-- Central Barbell Sleeve Hole -->
    <circle cx="0" cy="0" r="45" fill="#0b0b0b" stroke="#333333" stroke-width="4"/>
    
    <!-- Diamond Force Spark in center -->
    <polygon points="0,-30 20,0 0,30 -20,0" fill="url(#hexRust)"/>
    
    <!-- Crossbar weight ticks -->
    <rect x="-140" y="-3" width="280" height="6" fill="#ffffff" opacity="0.15"/>
    <rect x="-3" y="-140" width="6" height="280" fill="#ffffff" opacity="0.15"/>
  </g>
  
  <!-- Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#ffffff">IRONFORCE</text>
  <text x="300" y="515" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" letter-spacing="10" fill="#c45b25">ATHLETIC CONDITIONING</text>
</svg>