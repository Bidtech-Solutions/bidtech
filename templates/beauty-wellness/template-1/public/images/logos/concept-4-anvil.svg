<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e06e33"/>
      <stop offset="100%" stop-color="#c45b25"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" rx="36" fill="url(#bg4)"/>
  
  <!-- Dynamic Angular Anvil / Forward Force Chevron -->
  <g transform="translate(160, 130)">
    <!-- Base Anvil Horn Left -->
    <path d="M0,130 L60,80 L120,80 L90,130 Z" fill="#444444"/>
    
    <!-- Main Charging Forward Force Wings -->
    <path d="M80,50 L200,50 L270,120 L200,190 L80,190 L140,120 Z" fill="url(#arrowGrad)"/>
    
    <!-- Top Hammer Crown -->
    <polygon points="110,10 240,10 210,40 80,40" fill="#c45b25"/>
    
    <!-- Foundation Pillar -->
    <polygon points="120,200 240,200 210,230 90,230" fill="#ffffff" opacity="0.85"/>
  </g>
  
  <!-- Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#ffffff">IRONFORCE</text>
  <text x="300" y="515" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" letter-spacing="10" fill="#c45b25">EST. 2024</text>
</svg>